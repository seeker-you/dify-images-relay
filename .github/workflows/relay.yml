name: Relay Dify Images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Relay images from Docker Hub to GHCR
        env:
          GHCR_NAMESPACE: ${{ github.repository_owner }}
        run: |
          set -e
          images=(
            "langgenius/dify-api:1.17.1"
            "langgenius/dify-web:1.17.1"
            "langgenius/dify-plugin-daemon:0.6.10-local"
            "langgenius/dify-agent-backend:1.17.1"
            "langgenius/dify-agent-local-sandbox:1.17.1"
            "postgres:15-alpine"
            "redis:6-alpine"
            "nginx:latest"
            "ubuntu/squid:latest"
          )
          for img in "${images[@]}"; do
            name="${img//\//_}"
            echo "=== Relaying $img -> ghcr.io/${GHCR_NAMESPACE}/${name} ==="
            docker pull "$img"
            docker tag "$img" "ghcr.io/${GHCR_NAMESPACE}/${name}"
            docker push "ghcr.io/${GHCR_NAMESPACE}/${name}"
          done
          echo "ALL RELAYED"
